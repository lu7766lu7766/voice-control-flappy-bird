<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="水管鳥（Flappy Bird）復刻版：照原版手感與畫面重現，撐越久分數越高。支援鍵盤、滑鼠與觸控操作。" />
    <meta name="theme-color" content="#08161d" />
    <title>水管鳥復刻版 — 撐越久分數越高</title>
  </head>
  <body>
    <main id="app">
      <h1 class="sr-only">水管鳥復刻版</h1>
      <canvas id="game" aria-label="水管鳥遊戲畫面"></canvas>
      <p class="hint" id="hint">
        <kbd>Space</kbd> / <kbd>↑</kbd> / 點擊 / 觸控：拍翅
        <span class="dot">·</span> <kbd>P</kbd> 暫停
        <span class="dot">·</span> <kbd>M</kbd> 靜音
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
